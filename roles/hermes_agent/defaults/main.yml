---
# latest / stable
dapp_hermes_agent_docker_image: "nousresearch/hermes-agent:latest"

# Hermes Agent API
dapp_hermes_agent_traefik_address: "hermesagent.{{ dapp_common_domain }}"

# Hermes Dashboard WebUI (optional)
# dapp_hermes_dashboard_traefik_address: "hermes.{{ dapp_common_domain }}"

dapp_hermes_agent_docker_command: gateway run

# dapp_hermes_agent_docker_deploy:
#   resources:
#     limits:
#       memory: 4G
#       cpus: "2.0"

# Environment variables for docker compose file
dapp_hermes_agent_docker_environment:
  TZ: "UTC"
  # HERMES_DASHBOARD: "1"

  # API_SERVER_ENABLED: "true"
  # API_SERVER_HOST: "0.0.0.0"
  # API_SERVER_KEY: "$(openssl rand -hex 32)"
  # API_SERVER_CORS_ORIGINS: "*"

dapp_hermes_agent_docker_volumes:
  - "./data:/opt/data"

# Environment variables for hermes/data/.env file
# Apply using: -e hermes_config_update=true
# dapp_hermes_agent_environment:
#   ANTHROPIC_API_KEY: "ANTHROPIC_API_KEY"
#   OPENAI_API_KEY: "OPENAI_API_KEY"
#   TELEGRAM_BOT_TOKEN: "TELEGRAM_BOT_TOKEN"
#
#   BROWSERBASE_ADVANCED_STEALTH: "false"
#   BROWSERBASE_PROXIES: "true"
#   BROWSER_INACTIVITY_TIMEOUT: "120"
#   BROWSER_SESSION_TIMEOUT: "300"
#   IMAGE_TOOLS_DEBUG: "false"
#
#   # Matrix Channel
#   # Base auth; the device ID is derived from it automatically
#   MATRIX_ACCESS_TOKEN: "secret"
#   # E2EE requires the mautrix library with encryption extras and the libolm C library
#   MATRIX_E2EE_MODE: "required"
#   # If your Matrix account has cross-signing enabled (the default in
#   # Element), set the recovery key (aka "Security Key") so the bot can
#   # self-sign its device on startup. Without this, other Matrix
#   # clients may refuse to share encryption sessions with the bot after
#   # a device key rotation.
#   MATRIX_RECOVERY_KEY: "secret"
#   # For private Matrix deployments, set both user and room allowlists.
#   # Matrix users allowed to trigger agent turns
#   MATRIX_ALLOWED_USERS: "@changeme:matrix.org"
#   # Matrix rooms allowed to trigger agent turns
#   MATRIX_ALLOWED_ROOMS: "!changeme:matrix.org"
#   # Bridge/appservice ghost users to ignore
#   MATRIX_IGNORE_USER_PATTERNS: "'^@telegram_,^@whatsapp_'"
#   # Only enable notices when a trusted human workflow really sends m.notice
#   MATRIX_PROCESS_NOTICES: "false"
#   # Rooms exempt from mention requirement
#   MATRIX_FREE_RESPONSE_ROOMS: "!changeme:matrix.org"
#   # auto|room|thread; room is recommended for project rooms
#   MATRIX_SESSION_SCOPE: "room"
#   # You can designate a "home room" where the bot sends proactive
#   # messages (such as cron job output, reminders, and notifications).
#   MATRIX_HOME_ROOM: "!changeme:matrix.org"
#
#   MOA_TOOLS_DEBUG: "false"
#
#   TELEGRAM_BOT_TOKEN: "secret"
#   TELEGRAM_HOME_CHANNEL: "changeme"
#
#   TERMINAL_LIFETIME_SECONDS: "300"
#   TERMINAL_MODAL_IMAGE: "nikolaik/python-nodejs:python3.11-nodejs20"
#   TERMINAL_SSH_HOST: "192.168.0.23"
#   TERMINAL_SSH_USER: "hermesworker"
#   TERMINAL_TIMEOUT: "60"
#
#   VISION_TOOLS_DEBUG: "false"
#   WEB_TOOLS_DEBUG: "false"

