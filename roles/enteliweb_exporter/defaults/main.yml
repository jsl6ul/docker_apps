---
# This configuration format, including the [devices] section,
# is used in the main branch as of commit cf58164c3dc8b0f8985fd935b3cbac1db5b65d8b
# dapp_enteliweb_exporter_configuration: |
#   [enteliweb]
#   host = https://server
#   username = user
#   password = changeme
#   insecure = false
#
#   [exporter]
#   port = 8085
#
#   [devices]
#   //A site/10000.AO001 = MOD_VFD_PUMP, Pump modulation

# This new configuration format, using an external 'devices_file',
# is used in the "refactor_prom_output" development branch
# dapp_enteliweb_exporter_configuration: |
#   [enteliweb]
#   host = https://server
#   username = user
#   password = changeme
#   insecure = false
#   devices_file = /devices.txt
#
#   [exporter]
#   port = 8085

# Device file for use with the new configuration format.
# dapp_enteliweb_exporter_devices: |
#   //A site/10000.AO001 = MOD_VFD_PUMP

dapp_enteliweb_exporter_dockerfile: |
  FROM debian:stable-slim
  COPY entrypoint.sh /entrypoint.sh
  RUN DEBIAN_FRONTEND=noninteractive /usr/bin/apt-get update && \
    /usr/bin/apt-get upgrade -y && \
    /usr/bin/apt-get dist-upgrade -ufy && \
    /usr/bin/apt-get install git python3 python3-requests python3-prometheus-client -y && \
    /usr/bin/rm -rf /var/lib/apt/lists/*
  RUN git clone https://github.com/guilbaults/enteliweb-exporter.git
  RUN /usr/bin/chmod u+x /entrypoint.sh
  EXPOSE 8085/tcp
  ENTRYPOINT ["/entrypoint.sh"]

dapp_enteliweb_exporter_entrypoint: |
  #!/bin/bash
  /usr/bin/python3 /enteliweb-exporter/enteliweb-exporter.py /config.ini

# docker environment variables
dapp_enteliweb_exporter_docker_environment: |
  {{ dapp_common_docker_environment }}

# docker healthcheck variables
dapp_enteliweb_exporter_docker_healthcheck: |
  {{ dapp_common_docker_healthcheck }}

# dapp_enteliweb_exporter_docker_mem_limit: 512M

dapp_enteliweb_exporter_docker_ports:
  - "8085:8085"

dapp_enteliweb_exporter_docker_volumes:
  - "./config.ini:/config.ini"
  - "./devices.txt:/devices.txt"
